<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Entity-relationship diagram for the event management platform, showing nine tables: users, events, event_members, role_permissions, rooms, sessions, invitations, audit_log, and idempotency_keys, and how they relate.</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const graph = `erDiagram
    users {
        uuid id PK
        text subject UK
        citext email UK
        text name
        timestamptz created_at
        timestamptz updated_at
    }
    events {
        uuid id PK
        text name
        text description
        text timezone
        timestamptz starts_at
        timestamptz ends_at
        integer version
        timestamptz deleted_at
    }
    event_members {
        uuid id PK
        uuid event_id FK
        uuid user_id FK
        text role
    }
    role_permissions {
        text role PK
        text resource PK
        text action PK
    }
    rooms {
        uuid id PK
        uuid event_id FK
        text name
        integer capacity
        integer version
    }
    sessions {
        uuid id PK
        uuid event_id FK
        uuid room_id FK
        uuid speaker_id FK
        text title
        text description
        tstzrange time_range
        integer version
        timestamptz deleted_at
    }
    invitations {
        uuid id PK
        uuid event_id FK
        uuid user_id FK
        citext email
        text role
    }
    audit_log {
        uuid id PK
        uuid actor_id FK
        text entity_type
        uuid entity_id
        text action
        jsonb before
        jsonb after
        text request_id
    }
    idempotency_keys {
        uuid id PK
        uuid actor_id FK
        text key
        text endpoint
        text request_hash
        integer response_status
    }

    events           ||--o{ event_members    : "has roster"
    users            ||--o{ event_members    : "holds role"
    events           ||--o{ rooms            : "owns"
    events           ||--o{ sessions         : "schedules"
    rooms            ||--o{ sessions         : "hosts"
    users            ||--o{ sessions         : "speaks at"
    events           ||--o{ invitations      : "invites to"
    users            |o--o{ invitations      : "may be invitee"
    users            ||--o{ audit_log        : "acted"
    users            ||--o{ idempotency_keys : "retried"`;
const { svg } = await mermaid.render('erd-svg', graph);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
