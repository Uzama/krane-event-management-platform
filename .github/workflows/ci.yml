# CI exists from item 03 onward, and later items extend it -- item 05 adds the
# OpenAPI contract check, which the brief requires CI (not a local run) to enforce.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a literal: go.mod is the single source of truth for
      # the Go version, shared with scripts/require-go.sh.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

      # `make test` runs `make up` itself, so this brings the whole stack up on
      # the runner's Docker and migrates a fresh throwaway database.
      - name: Test
        run: make test

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
