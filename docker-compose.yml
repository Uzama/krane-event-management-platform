# Local stack for the Event Management Platform.
#
# Item 02's migration hard-codes `ALTER DEFAULT PRIVILEGES FOR ROLE krane_migrator`,
# so POSTGRES_USER below MUST stay krane_migrator: run the migrations as any other
# role and every future table reaches the API with no grants at all.
#
# The two one-shot services (migrate, app-role) sit behind the `tools` profile so a
# bare `docker compose up` does not try to keep them running. The Makefile invokes
# them with `docker compose run --rm`, which activates the profile automatically and
# gives make a real exit code to propagate -- `up --wait` treats a service that
# exits as a failure, which is exactly what a one-shot is supposed to do.
#
# `api` (item 04) is NOT started by `make up`: `make test` runs `go test ./...`
# directly against Postgres on the host (same pattern as migrations/schema_test.go),
# so the graded pipeline never needs a containerized API process. This service is
# for a full local-stack run -- `docker compose up api` -- matching the topology in
# docs/components.md.

name: krane

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krane_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_migrator}
      POSTGRES_DB: ${POSTGRES_DB:-krane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The postgres:18+ images
      # store data in a major-version subdirectory so `pg_upgrade --link` can work
      # across a single mount point; mounting the old 9.x-17 path makes the
      # container refuse to start outright. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krane_migrator} -d ${POSTGRES_DB:-krane}"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 3s

  # Mock OIDC issuer. The API validates JWTs against its JWKS and never mints
  # them; swapping this for a hosted issuer is one env var (item 06).
  # No healthcheck: the image ships without a shell to run one in, so the
  # Makefile polls the discovery endpoint from the host instead.
  #
  # JSON_CONFIG (verified against this exact pinned image, not just its docs)
  # gives the "default" issuer four claim mappings, matched on a token
  # request's form parameters:
  #   - demo-admin / demo-contributor / demo-attendee: fixed identities for
  #     `make token USER=...`. These carry identity only (sub/email/name/aud)
  #     -- never a role. Roles live in event_members starting item 09.
  #   - test_sub/test_aud: test-only plumbing so Go tests can mint a token
  #     for an arbitrary, unique subject (and deliberately wrong audiences)
  #     without touching the three fixed demo identities -- keeps parallel
  #     test packages from colliding on users.subject's unique constraint.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "tokenCallbacks": [{
            "issuerId": "default",
            "requestMappings": [
              { "requestParam": "client_id", "match": "demo-admin",
                "claims": {"sub": "demo-admin", "email": "admin@demo.krane", "name": "Demo Admin", "aud": ["krane-api"]}},
              { "requestParam": "client_id", "match": "demo-contributor",
                "claims": {"sub": "demo-contributor", "email": "contributor@demo.krane", "name": "Demo Contributor", "aud": ["krane-api"]}},
              { "requestParam": "client_id", "match": "demo-attendee",
                "claims": {"sub": "demo-attendee", "email": "attendee@demo.krane", "name": "Demo Attendee", "aud": ["krane-api"]}},
              { "requestParam": "test_sub", "match": ".*",
                "claims": {"sub": "$${test_sub}", "email": "$${test_sub}@test.krane", "name": "Test User", "aud": ["$${test_aud}"]}}
            ]
          }]
        }
    ports:
      - "${OIDC_PORT:-9090}:8080"

  # One-shot. The Makefile appends `-database <dsn> up`, so the same service
  # migrates both the dev database and the throwaway test one.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations"]

  # One-shot. Sets the runtime role's password from the environment: item 02
  # creates krane_app with LOGIN and no password on purpose, because a
  # credential must never be committed inside a migration.
  # :'app_password' is psql's quote-and-escape form -- never string-concatenate
  # a password into DDL.
  app-role:
    image: postgres:18.6
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-krane_migrator}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_only_migrator}
      PGDATABASE: ${POSTGRES_DB:-krane}
      KRANE_APP_USER: ${KRANE_APP_USER:-krane_app}
      KRANE_APP_PASSWORD: ${KRANE_APP_PASSWORD:-dev_only_app}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v app_user="$$KRANE_APP_USER" -v app_password="$$KRANE_APP_PASSWORD" <<'SQL'
        ALTER ROLE :"app_user" WITH PASSWORD :'app_password';
        SQL

  # cmd/api, containerized. Not part of `make up`'s default set -- see the note
  # above the `postgres` service. `HTTP_PORT` is the fixed in-container port
  # (matches the Dockerfile's EXPOSE 8080); `API_PORT` is the host-side mapping,
  # named like `POSTGRES_PORT`/`OIDC_PORT`.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${KRANE_APP_USER:-krane_app}:${KRANE_APP_PASSWORD:-dev_only_app}@postgres:5432/${POSTGRES_DB:-krane}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OIDC_ISSUER_URL: http://oidc:8080/default
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-krane-api}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
