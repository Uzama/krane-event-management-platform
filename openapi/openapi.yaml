openapi: 3.0.3
info:
  title: Krane Event Management Platform
  description: >
    The documented API contract. Every endpoint lands here before it lands in
    code -- see FEATURES.md item 05 and CLAUDE.md's feature workflow.
  version: "0.1.0"

paths:
  /health:
    get:
      operationId: getHealth
      summary: Readiness check
      description: >
        Pings the database pool. 200 only when the process is up and the
        database is reachable.
      responses:
        "200":
          description: The service and its database are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/events:
    post:
      operationId: createEvent
      summary: Create an event
      description: >
        Any authenticated user may create an event -- role_permissions has no
        event:create row (item 07), since creating an event precedes any
        event_members row to check. The creator is atomically granted an
        admin event_members row on the new event (item 08).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listEvents
      summary: List events the caller is a member of
      description: >
        Scoped to the caller's event_members rows -- access is membership
        (docs/requirements.md §4 point 3), not a per-resource Can() check.
        Keyset-paginated over (created_at, id); never OFFSET.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque token from a previous response's next_cursor.
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: The cursor query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEvent
      summary: Get an event
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: patchEvent
      summary: Update an event
      description: >
        Version-gated: the request's version must match the row's current
        version or the write is rejected as a conflict (item 17's
        lost-update protection, introduced here). starts_at and ends_at
        must be provided together or not at all.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPatchRequest"
      responses:
        "200":
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteEvent
      summary: Delete (soft-delete) an event
      description: >
        version is required as a query parameter. This is the permanent
        mechanism (item 17), not an ETag/If-Match interim -- uniform across
        events/rooms/sessions (query parameter on delete, body field on
        patch) and event_members.
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: The event was soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/members:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createMember
      summary: Add a member to an event
      description: >
        Identifies the target by email, resolved atomically inside the same
        write -- there is no "search users" endpoint. Only an admin may
        grant anything but attendee (item 09); the permission matrix already
        restricts this route to admin, and the repository additionally
        guards against granting an elevated role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreateRequest"
      responses:
        "201":
          description: The created membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No user has signed in with that email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: That user is already a member of this event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listMembers
      summary: List an event's roster
      description: >
        Keyset-paginated over (created_at, id); never OFFSET. admin and
        contributor only -- attendee has no member:read permission.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque token from a previous response's next_cursor.
      responses:
        "200":
          description: A page of the event's roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          description: The cursor query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/members/{memberId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: assignMemberRole
      summary: Change a member's role
      description: >
        Its own action (assign-role), distinct from a generic member update
        -- a contributor may add members but never assign-role
        (docs/requirements.md §4). Version-gated. Rejected with 409
        last_admin if it would leave the event with zero admins.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAssignRoleRequest"
      responses:
        "200":
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The member's version no longer matches (version_conflict) --
            error.details.current carries the member's fresh state, shaped
            by the same role-aware presenter GET uses (never a raw row);
            null if the member was removed by the write that won the race
            -- or this change would leave the event with zero admins
            (last_admin, no details.current).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: removeMember
      summary: Remove a member from an event
      description: >
        version is required as a query parameter -- the permanent
        mechanism (item 17), not an interim one. Rejected with 409
        last_admin if it would leave the event with zero admins.
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: The member was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The member's version no longer matches (version_conflict) --
            error.details.current carries the member's fresh state, shaped
            by the same role-aware presenter GET uses; null if already
            removed by the write that won the race -- or removing them
            would leave the event with zero admins (last_admin, no
            details.current).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/rooms:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createRoom
      summary: Create a room in an event
      description: >
        Unlike POST /v1/events, role_permissions already has room:create
        rows for admin/contributor (item 07), so this route runs behind
        Authz(room, create) -- there is no events-style Auth-only
        carve-out. Room names are unique within the event
        (rooms_event_id_name_key).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateRequest"
      responses:
        "201":
          description: The created room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another room in this event already has that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listRooms
      summary: List an event's rooms
      description: >
        Keyset-paginated over (created_at, id); never OFFSET.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque token from a previous response's next_cursor.
      responses:
        "200":
          description: A page of rooms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "400":
          description: The cursor query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/rooms/{roomId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRoom
      summary: Get a room
      description: >
        Scoped to both eventId and roomId -- a room belonging to a
        different event is indistinguishable from a missing one (404).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchRoom
      summary: Update a room
      description: >
        Version-gated: the request's version must match the row's current
        version or the write is rejected as a conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomPatchRequest"
      responses:
        "200":
          description: The updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The room's version no longer matches (version_conflict) --
            error.details.current carries the room's fresh state (the same
            shape GET returns); null if deleted by the write that won the
            race -- or another room in this event already has the new name
            (room_name_taken, no details.current).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteRoom
      summary: Delete a room
      description: >
        A real hard delete -- rooms has no deleted_at column. version is
        required as a query parameter -- the permanent mechanism (item 17),
        not an interim one. Rejected with 409 room_in_use if the room
        still has sessions referencing it; there is no cascade -- remove
        or reassign them first.
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: The room was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The room's version no longer matches (version_conflict) --
            error.details.current carries the room's fresh state; null if
            already deleted by the write that won the race -- or it still
            has sessions referencing it (room_in_use, no details.current).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/sessions:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createSession
      summary: Create a session in an event
      description: >
        Like rooms, role_permissions already has session:create rows for
        admin/contributor (item 07), so this route runs behind
        Authz(session, create) -- there is no events-style Auth-only
        carve-out. room_id must reference a room belonging to this same
        event (404 room_not_found otherwise, the same treatment a
        cross-event room reference gets everywhere else); speaker_id must
        reference an existing user (404 speaker_not_found otherwise) --
        any user, not just an event member (docs/requirements.md D3).
        starts_at/ends_at are LOCAL wall-clock strings with no offset,
        resolved server-side against the event's own timezone -- see the
        SessionCreateRequest schema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: The created session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            room_id doesn't reference a room in this event
            (room_not_found), or speaker_id doesn't reference an existing
            user (speaker_not_found). When both are invalid, room_not_found
            always wins -- the room lookup gates the insert, so the
            speaker reference is never evaluated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listSessions
      summary: List an event's sessions
      description: >
        Keyset-paginated over (created_at, id); never OFFSET. Every role
        that can reach this route sees the full list -- unlike the event
        roster, there is no per-session field to hide; scoping is entirely
        the Authz chokepoint (a non-member gets 403, never a filtered
        list).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque token from a previous response's next_cursor.
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          description: The cursor query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/sessions/{sessionId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      summary: Get a session
      description: >
        Scoped to both eventId and sessionId -- a session belonging to a
        different event, or soft-deleted, is indistinguishable from a
        missing one (404).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchSession
      summary: Update a session
      description: >
        Version-gated: the request's version must match the row's current
        version or the write is rejected as a conflict. room_id/speaker_id
        are NOT patchable at all -- fixed at creation
        (docs/requirements.md §8); this schema has no fields for them.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPatchRequest"
      responses:
        "200":
          description: The updated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The session's version no longer matches (version_conflict) --
            error.details.current carries the session's fresh state (the
            same shape GET returns); null if deleted by the write that won
            the race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteSession
      summary: Delete a session
      description: >
        A soft delete (sessions.deleted_at set) -- matching events, not
        rooms: docs/requirements.md D9 says cancelling a session frees its
        room and speaker slot immediately. version is required as a query
        parameter -- the permanent mechanism (item 17), not an interim one.
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: The session was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The session's version no longer matches (version_conflict) --
            error.details.current carries the session's fresh state; null
            if already deleted by the write that won the race.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/invitations:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createInvitation
      summary: Invite someone to an event
      description: >
        An independent record, not a pre-membership state machine (D1) --
        creating an invitation never touches event_members. email need not
        belong to an existing user (D2): user_id resolves atomically at
        invite time if a matching account exists, and stays null
        permanently otherwise -- it is never re-resolved later if the
        invitee signs up afterward. Only an admin may invite at any role;
        a contributor may invite attendee only (403 cannot_invite_at_role
        otherwise) -- the same escalation guard item 09's add-member uses,
        shared verbatim. There is no update or delete path: a wrong-role
        invitation cannot be corrected via this API once created, only
        re-sent under a different email or left as-is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: The created invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Either the caller has no invitation:create permission on this
            event (forbidden), or the caller is a contributor attempting to
            invite above attendee (cannot_invite_at_role).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: This event already has an invitation for that email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      operationId: listInvitations
      summary: List an event's invitations
      description: >
        Keyset-paginated over (created_at, id); never OFFSET. admin and
        contributor only -- attendee has no invitation:read permission.
        Email is visible to both roles (D14) -- a scoped exception to D11,
        since the email is data the caller supplied, not roster PII.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque token from a previous response's next_cursor.
      responses:
        "200":
          description: A page of the event's invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "400":
          description: The cursor query parameter is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/events/{eventId}/invitations/bulk:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: bulkCreateInvitations
      summary: Invite several people to an event, idempotently
      description: >
        Item 21. Requires an Idempotency-Key header. Each item is invited
        through the exact same escalation-guarded, audited write as POST
        .../invitations, one at a time -- a partial failure (one email
        already invited, one role the caller can't grant) never fails the
        whole batch; every item gets its own result in the 207 body. A
        retry with the same Idempotency-Key and an identical body replays
        the stored result verbatim, never reprocessing the items or
        re-checking current state (so a result stays "created" even if the
        caller's own role has since changed). A retry with the same key
        but a different body is rejected outright (422
        idempotency_key_conflict) -- never silently replayed, never
        silently reprocessed.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInviteRequest"
      responses:
        "207":
          description: Per-item results -- see BulkInviteResponse. Always 207, even when every item succeeded or every item failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInviteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Either the request body failed shape validation (missing
            Idempotency-Key, empty invitations list, a malformed item), or
            this Idempotency-Key was already used with a different request
            body (idempotency_key_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: >
        The caller lacks permission. Never distinguishes a non-existent
        event from one the caller isn't a member of (item 07).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The event does not exist or is soft-deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: >
        The event's version no longer matches (lost-update protection,
        item 17). error.details.current carries the event's fresh state
        (the same shape GET returns), so the caller can retry immediately
        with the current version instead of a second round trip. null if
        the event was deleted by the write that won the race.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: The request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok

    # The one error envelope every handler's failure path uses -- see
    # internal/http/response/error.go. `details` is always present, never
    # omitted, even when empty.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    # internal/http/response/event.go's EventResponse, field for field. No
    # deleted_at -- a soft-deleted event surfaces as 404, never a visible
    # flag. No roster/email to hide (item 10 is about the member resource,
    # not this one).
    Event:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - timezone
        - starts_at
        - ends_at
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA timezone name, e.g. Asia/Colombo.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Absent when there is no further page.

    # internal/http/request/event.go's CreateEventRequest. All fields
    # required -- there is no absent-vs-null distinction to make on create.
    EventCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - timezone
        - starts_at
        - ends_at
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        timezone:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    # internal/http/request/event.go's PatchEventRequest. Every field but
    # version is optional AND nullable (domain/opt.Optional[T] on the Go
    # side) -- OpenAPI 3.0 can only declare a field optional-or-nullable,
    # not the three-way absent/null/value distinction itself; that
    # distinction is enforced by the hand-written request DTO, not this
    # schema (CLAUDE.md's PATCH-semantics invariant).
    EventPatchRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: Must match the event's current version (optimistic lock).
        name:
          type: string
        description:
          type: string
          nullable: true
        timezone:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    # internal/http/response/member.go's MemberResponse, field for field.
    # user_email is intentionally NOT required -- item 10 / D11
    # (docs/requirements.md §7.2): it's present only for an admin caller and
    # omitted entirely (not blanked) for a contributor. Every other field is
    # shared by every role that can reach this route (admin, contributor --
    # attendee has no member:read permission at all).
    Member:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - user_id
        - user_name
        - role
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_email:
          type: string
        user_name:
          type: string
        role:
          type: string
          enum: [admin, contributor, attendee]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Absent when there is no further page.

    # internal/http/request/member.go's AddMemberRequest.
    MemberCreateRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, contributor, attendee]

    # internal/http/request/member.go's AssignRoleRequest. Role is always
    # the field being set -- no absent-vs-null distinction to make on a
    # single-field assign, so both fields are plain required properties.
    MemberAssignRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
        - version
      properties:
        role:
          type: string
          enum: [admin, contributor, attendee]
        version:
          type: integer
          description: Must match the member's current version (optimistic lock).

    # internal/http/response/room.go's RoomResponse, field for field. No
    # deleted_at -- rooms has no such column; deletion is a real hard
    # DELETE, not a soft-delete flag. No email/roster to hide (item 10 only
    # narrowed the member resource), so unlike Member this has no role-gated
    # fields.
    Room:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - name
        - capacity
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          nullable: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoomList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Absent when there is no further page.

    # internal/http/request/room.go's CreateRoomRequest. Capacity is a plain
    # nullable integer -- there is no absent-vs-null distinction to make on
    # create.
    RoomCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        capacity:
          type: integer
          nullable: true
          description: Must be greater than zero when present.

    # internal/http/request/room.go's PatchRoomRequest. Capacity is optional
    # AND nullable (domain/opt.Optional[*int] on the Go side) -- OpenAPI 3.0
    # can only declare a field optional-or-nullable, not the three-way
    # absent/null/value distinction itself; that distinction is enforced by
    # the hand-written request DTO, not this schema (CLAUDE.md's
    # PATCH-semantics invariant). A set value of exactly 0 is rejected by
    # the DTO's Validate() -- it is a *set* to an invalid value
    # (rooms_capacity_check requires > 0), not a clear.
    RoomPatchRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: Must match the room's current version (optimistic lock).
        name:
          type: string
        capacity:
          type: integer
          nullable: true
          description: Must be greater than zero when present and non-null.

    # internal/http/response/session.go's SessionResponse. starts_at/ends_at
    # ARE format: date-time here (unlike the request schemas below) --
    # they're the resolved instants, rendered with the correct offset for
    # the event's own timezone at that specific instant (item 12's DST
    # must-test: a session spanning a transition may show two different
    # offsets). duration_minutes is computed from the raw instants, never
    # from the localized wall-clock fields.
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - room_id
        - speaker_id
        - title
        - description
        - starts_at
        - ends_at
        - duration_minutes
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        speaker_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          description: The actual elapsed duration (ends_at - starts_at), never a naive wall-clock component subtraction.
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        room_name:
          type: string
          description: >
            Present only on GET (list) rows (item 18) -- batched via a
            single JOIN so query count stays constant regardless of page
            size, never a per-row lookup. Absent (not null) on create/get
            single/update responses and on a version-conflict's
            details.current.
        speaker_name:
          type: string
          description: Present only on GET (list) rows -- see room_name.

    SessionList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Absent when there is no further page.

    # internal/http/request/session.go's CreateSessionRequest. starts_at/
    # ends_at are LOCAL wall-clock strings -- no timezone offset, no "Z" --
    # resolved server-side against the event's own timezone
    # (utils.ResolveLocalTime). A local time that falls in a spring-forward
    # DST gap (e.g. 2:30am on a day the clock jumps 2:00am -> 3:00am) is
    # rejected as 422, not silently normalized; an ambiguous fall-back time
    # (one that occurs twice) resolves to the earlier of the two instants,
    # a documented convention, not an error.
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - room_id
        - speaker_id
        - title
        - starts_at
        - ends_at
      properties:
        room_id:
          type: string
          format: uuid
          description: Must belong to this same event.
        speaker_id:
          type: string
          format: uuid
          description: Any existing user -- not required to be a member of this event.
        title:
          type: string
        description:
          type: string
          nullable: true
        starts_at:
          type: string
          description: >
            Local wall-clock time, no offset (e.g. "2026-06-15T09:00:00"),
            resolved against the event's timezone. NOT format: date-time --
            an offset here is rejected.
        ends_at:
          type: string
          description: Same format as starts_at. Must resolve to an instant after starts_at.

    # internal/http/request/session.go's PatchSessionRequest. room_id/
    # speaker_id are deliberately absent from this schema, not merely
    # optional -- they are not patchable at all (docs/requirements.md §8,
    # staged for TRADEOFFS.md). starts_at/ends_at must both be provided
    # together or neither -- time_range is one column, so a partial change
    # would need a read the versioned UPDATE is built to avoid.
    SessionPatchRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          description: Must match the session's current version (optimistic lock).
        title:
          type: string
        description:
          type: string
          nullable: true
        starts_at:
          type: string
          description: Local wall-clock time, no offset. Must be provided together with ends_at.
        ends_at:
          type: string
          description: Local wall-clock time, no offset. Must be provided together with starts_at.

    # internal/http/response/invitation.go's InvitationResponse, field for
    # field. Unlike Member, user_email has no role-gated visibility -- D14:
    # email is visible to every role that can reach this route (admin and
    # contributor; attendee has no invitation:read permission at all),
    # since it's data the caller supplied to create the record, not roster
    # PII someone else added. user_id is nullable and required (present as
    # an explicit null, never omitted) -- D2: it resolves once at invite
    # time if the email matches an existing account, and stays null
    # permanently otherwise.
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - event_id
        - user_id
        - email
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, contributor, attendee]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvitationList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        next_cursor:
          type: string
          description: Opaque keyset cursor. Absent when there is no further page.

    # internal/http/request/invitation.go's InvitationCreateRequest. role is
    # shape-validated here (must be a known role) but NOT restricted by
    # caller -- whether a contributor may invite at that role is an
    # authorization decision, answered 403 cannot_invite_at_role by the
    # repository, never 422 here.
    InvitationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, contributor, attendee]

    # internal/http/request/invitation.go's BulkInviteRequest.
    BulkInviteRequest:
      type: object
      additionalProperties: false
      required:
        - invitations
      properties:
        invitations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvitationCreateRequest"

    BulkInviteItemResult:
      type: object
      additionalProperties: false
      required:
        - email
        - status
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [created, conflict, forbidden]
        invitation_id:
          type: string
          format: uuid
          description: Present only when status is "created".

    BulkInviteResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkInviteItemResult"
